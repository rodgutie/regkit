# ============================================================================
# EXPLICITLY DEAD / DO NOT BUILD — these appear in older sources and search
# results but are no longer good law. Listed here specifically so nobody
# (human or AGENT-7) accidentally builds a rule citing them.
# ============================================================================

explicitly_dead_do_not_build:
  - id: co-sb24-205
    name: "Colorado SB 24-205 (original 'Colorado AI Act')"
    status: "REPEALED before ever taking effect. Replaced by SB 26-189."
    why_it_keeps_appearing: "Most blog content and even some compliance vendor marketing still describes this as current law — it is not. Always verify against SB 26-189 instead."

  - id: ca-sb942-jan2026-date
    name: "California SB 942 original January 1, 2026 effective date"
    status: "SUPERSEDED — AB 853 delayed it to August 2, 2026"
    why_it_keeps_appearing: "Many 2025-era sources still cite the original date"


# ============================================================================
# CROSS-JURISDICTION CONFLICT TABLE — the single most valuable artifact
# in this document for demonstrating RegKit's actual technical differentiator
# ============================================================================

conflicting_standards_same_fact_pattern:
  scenario: "AI model uses zip code as an input feature; disparate impact results for a protected class; no proof of discriminatory intent exists"

  outcomes_by_jurisdiction:
    - jurisdiction: "Texas (TRAIGA)"
      outcome: "NOT independently sufficient for liability — intent must be separately shown (§552.056(c))"
      rule_ref: "RK-TX-TRAIGA-001 → WARN severity, flagged for human review"

    - jurisdiction: "Illinois (HB 3773)"
      outcome: "SUFFICIENT for liability on its own — explicit zip-code prohibition, outcome-based, intent is not a defense"
      rule_ref: "RK-IL-HB3773-001 → should be BLOCK severity (to build)"

    - jurisdiction: "GDPR (Art. 22, if EU data subject)"
      outcome: "Relevant to whether decision is 'solely automated' with 'significant effect' — separate analytical question from discrimination per se, but proxy presence raises Art. 9/22(4) special-category concerns"
      rule_ref: "RK-GDPR-022 → BLOCK or WARN depending on human-review presence"

    - jurisdiction: "Colorado (SB 26-189, current law)"
      outcome: "Not directly addressed — old SB 24-205's standalone 'duty to avoid algorithmic discrimination' was REMOVED in the rewrite; current law focuses on notice/explanation, not discrimination prevention per se"
      rule_ref: "RK-CO-ADMT-001 → not the primary trigger under current law"

  why_this_matters_for_the_pitch: >
    This is the single clearest, most concrete proof that "one AI compliance
    rule" is structurally impossible to build correctly. The exact same
    code, the exact same fact pattern, produces a BLOCK in Illinois, a WARN
    in Texas, a conditional finding under GDPR, and effectively no finding
    under current Colorado law. Any tool that doesn't encode jurisdiction-
    specific legal standards — not just jurisdiction-specific PENALTIES —
    will systematically misinform developers in at least 3 of these 4
    jurisdictions on this single fact pattern.


